<!-- CSS mínimo, mismo estilo que el catálogo -->
<style>
  table { border-collapse: collapse; margin: 0 auto; }
  th, td { border: 1px solid black; padding: 6px 10px; text-align: center; }
  .toolbar { text-align: center; margin-bottom: 8px; }
  .footer { text-align: center; }
  h1 { text-align: center; }
  .header { text-align: center; }

  /* Formulario */
  .form-contenedor { max-width: 480px; margin: 20px auto; }
  .form-contenedor table { width: 100%; }
  .form-contenedor td:first-child { text-align: right; font-weight: bold; white-space: nowrap; }
  .form-contenedor td:last-child { text-align: left; }
  .form-contenedor input,
  .form-contenedor select { width: 100%; box-sizing: border-box; padding: 3px 5px; font-size: 14px; }
  .form-acciones { text-align: center; margin-top: 10px; }
  .form-acciones button { margin: 0 4px; padding: 4px 16px; }
</style>

<div class="contenedor-principal">
  <div class="header">
    <h1>Agregar Mueble</h1>
  </div>
  <hr>

  <div class="form-contenedor">
    <form action="#" method="post">
      <table>
        <tbody>
          <tr>
            <td>Descripcion:</td>
            <td><input type="text" name="descripcion" value="Mesa de comedor 6 personas"></td>
          </tr>
          <tr>
            <td>Categoria:</td>
            <td>
              <select name="categoria">
                <option value="sillas">Sillas</option>
                <option value="mesas" selected>Mesas</option>
                <option value="estantes">Estantes</option>
                <option value="otros">Otros</option>
              </select>
            </td>
          </tr>
          <tr>
            <td>Ancho (cm):</td>
            <td><input type="number" name="ancho" value="160"></td>
          </tr>
          <tr>
            <td>Alto (cm):</td>
            <td><input type="number" name="alto" value="75"></td>
          </tr>
          <tr>
            <td>Largo (cm):</td>
            <td><input type="number" name="largo" value="90"></td>
          </tr>
          <tr>
            <td>Peso (kg):</td>
            <td><input type="number" name="peso" value="32"></td>
          </tr>
        </tbody>
      </table>

      <div class="form-acciones">
        <button type="button" onclick="location.href='dashboard2.html'">Guardar</button>
        <button type="button" onclick="history.back()">Cancelar</button>
      </div>
    </form>
  </div>

  <hr>
  <div class="footer">Sistema de catálogo de muebles &mdash; Gestión de Calidad (2026)</div>
</div>
